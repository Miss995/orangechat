<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ff8a3d">
<title>工具面板</title>
<style>
  :root{
    --bg:#fff8f3; --card:#ffffff; --line:#f2e3d8; --text:#2b2320; --dim:#a08e84;
    --accent:#ff8a3d; --soft:#fff1e6; --err:#dd5545; --radius:16px;
  }
  @media (prefers-color-scheme:dark){
    :root{
      --bg:#181310; --card:#221b17; --line:#332924; --text:#f4eae4; --dim:#8d7b71;
      --accent:#ff9a52; --soft:#2e211a; --err:#ff6f5e;
    }
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg);color:var(--text);
    font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC","Microsoft YaHei",sans-serif;
    padding:calc(14px + env(safe-area-inset-top)) 14px calc(44px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }
  header{margin-bottom:12px}
  .row{display:flex;align-items:center;gap:10px}
  h1{font-size:20px;margin:0;font-weight:700;letter-spacing:.4px}
  h1 .dot{color:var(--accent)}
  .badge{
    margin-left:auto;font-size:12px;padding:3px 10px;border-radius:999px;white-space:nowrap;
    background:var(--soft);color:var(--accent);font-weight:600;
  }
  .badge.err{background:rgba(221,85,69,.14);color:var(--err)}
  .sub{margin:8px 0 0;color:var(--dim);font-size:13px}
  .search-wrap{position:sticky;top:0;z-index:5;padding:6px 0 10px;background:linear-gradient(var(--bg) 72%,transparent)}
  input[type=search]{
    width:100%;padding:11px 14px;border-radius:12px;border:1px solid var(--line);
    background:var(--card);color:var(--text);font-size:14px;outline:none;appearance:none;
  }
  input[type=search]:focus{border-color:var(--accent)}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:13px 14px;margin-bottom:10px;transition:border-color .15s;
  }
  .card.open{border-color:var(--accent)}
  .head{display:flex;align-items:baseline;gap:8px;cursor:pointer}
  .name{font-size:14px;font-weight:700;word-break:break-all;
    font-family:ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--text)}
  .flag{margin-left:auto;font-size:11px;color:var(--dim);white-space:nowrap;flex:none}
  .desc{margin:6px 0 0;font-size:13px;color:var(--dim);line-height:1.55;
    display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
  .card.open .desc{-webkit-line-clamp:unset}
  .runner{display:none;margin-top:12px;padding-top:12px;border-top:1px dashed var(--line)}
  .card.open .runner{display:block}
  label{display:block;font-size:12px;color:var(--dim);margin-bottom:6px}
  textarea{
    width:100%;min-height:64px;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:var(--bg);color:var(--text);resize:vertical;outline:none;
    font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  textarea:focus{border-color:var(--accent)}
  .actions{display:flex;gap:8px;margin-top:10px}
  button{
    flex:1;padding:10px;border-radius:10px;border:none;font-size:14px;font-weight:600;
    background:var(--soft);color:var(--accent);cursor:pointer;
  }
  button.go{background:var(--accent);color:#fff}
  button:disabled{opacity:.55}
  .out{
    margin:12px 0 0;padding:11px 12px;border-radius:10px;background:var(--bg);
    border:1px solid var(--line);white-space:pre-wrap;word-break:break-word;
    max-height:300px;overflow:auto;
    font:12px/1.55 ui-monospace,SFMono-Regular,Menlo,monospace;
  }
  .out.err{color:var(--err);border-color:rgba(221,85,69,.4)}
  .empty,.hint{color:var(--dim);font-size:13px;text-align:center;padding:26px 0}
  .spin{display:inline-block;width:12px;height:12px;border:2px solid rgba(255,255,255,.4);
    border-top-color:#fff;border-radius:50%;animation:sp .7s linear infinite;vertical-align:-1px;margin-right:6px}
  @keyframes sp{to{transform:rotate(360deg)}}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>工具面板<span class="dot">。</span></h1>
    <span class="badge" id="badge">连接中…</span>
  </div>
  <p class="sub">这些都是猫现在真的有的工具。点开一个，填参数，按下去就执行。</p>
</header>

<div class="search-wrap">
  <input id="q" type="search" placeholder="搜工具名或用途…" autocomplete="off" spellcheck="false">
</div>

<main id="list"><p class="hint">正在问猫要工具清单…</p></main>

<script>
(function(){
  'use strict';

  var TOOLS = [];
  var PINNED = ['get_time_info','post_notification','set_alarm','app_switch','eryu_music',
                'get_app_usage','get_notifications','read_app_logs'];

  function $(id){ return document.getElementById(id); }

  function waitBridge(timeoutMs){
    return new Promise(function(resolve,reject){
      var t0 = Date.now();
      (function poll(){
        if (typeof window.__bridgeCall === 'function') return resolve();
        if (Date.now() - t0 > timeoutMs) return reject(new Error('桥没就绪'));
        setTimeout(poll, 120);
      })();
    });
  }

  function call(method, params){
    return waitBridge(8000).then(function(){
      return window.__bridgeCall(method, params || {});
    }).then(function(raw){
      if (typeof raw === 'string'){
        try { return JSON.parse(raw); } catch(e){ return {ok:false, error:'返回的不是 JSON：' + raw}; }
      }
      return raw || {ok:false, error:'空返回'};
    });
  }

  function setBadge(text, isErr){
    var b = $('badge');
    b.textContent = text;
    b.className = 'badge' + (isErr ? ' err' : '');
  }

  function buildCard(t){
    var card = document.createElement('article');
    card.className = 'card';

    var head = document.createElement('div');
    head.className = 'head';

    var name = document.createElement('span');
    name.className = 'name';
    name.textContent = t.name;
    head.appendChild(name);

    if (t.needsApproval){
      var flag = document.createElement('span');
      flag.className = 'flag';
      flag.textContent = '需批准';
      head.appendChild(flag);
    }

    var desc = document.createElement('p');
    desc.className = 'desc';
    desc.textContent = t.description || '（这个工具没写说明）';

    var runner = document.createElement('div');
    runner.className = 'runner';

    var lab = document.createElement('label');
    lab.textContent = '参数（JSON，不需要就留 {}）';

    var ta = document.createElement('textarea');
    ta.value = '{}';
    ta.spellcheck = false;

    var actions = document.createElement('div');
    actions.className = 'actions';

    var go = document.createElement('button');
    go.className = 'go';
    go.textContent = '执行';

    var close = document.createElement('button');
    close.textContent = '收起';

    actions.appendChild(go);
    actions.appendChild(close);

    var out = document.createElement('pre');
    out.className = 'out';
    out.hidden = true;

    runner.appendChild(lab);
    runner.appendChild(ta);
    runner.appendChild(actions);
    runner.appendChild(out);

    head.addEventListener('click', function(){ card.classList.toggle('open'); });

    close.addEventListener('click', function(ev){
      ev.stopPropagation();
      card.classList.remove('open');
    });

    go.addEventListener('click', function(ev){
      ev.stopPropagation();
      run(t, ta, go, out, card);
    });

    card.appendChild(head);
    card.appendChild(desc);
    card.appendChild(runner);
    return card;
  }

  function run(t, ta, go, out, card){
    var argsText = (ta.value || '').trim() || '{}';
    var parsed;
    try {
      parsed = JSON.parse(argsText);
    } catch(e){
      out.hidden = false;
      out.className = 'out err';
      out.textContent = '参数不是合法 JSON：' + e.message;
      return;
    }

    go.disabled = true;
    go.innerHTML = '<span class="spin"></span>跑着…';
    out.hidden = false;
    out.className = 'out';
    out.textContent = '已递过去，等结果…';

    call('tools.call', {name: t.name, args: JSON.stringify(parsed)}).then(function(r){
      go.disabled = false;
      go.textContent = '执行';
      if (r && r.ok){
        out.className = 'out';
        out.textContent = r.output || '（没有输出）';
      } else {
        out.className = 'out err';
        out.textContent = '✕ ' + ((r && r.error) || '不知道为啥失败了');
      }
    }).catch(function(e){
      go.disabled = false;
      go.textContent = '执行';
      out.className = 'out err';
      out.textContent = '✕ ' + (e && e.message ? e.message : String(e));
    });
  }

  function render(){
    var q = ($('q').value || '').trim().toLowerCase();
    var host = $('list');

    var rows = TOOLS.filter(function(t){
      if (!q) return true;
      return (t.name + ' ' + (t.description || '')).toLowerCase().indexOf(q) >= 0;
    });

    rows.sort(function(a, b){
      var ia = PINNED.indexOf(a.name), ib = PINNED.indexOf(b.name);
      if (ia < 0) ia = 999;
      if (ib < 0) ib = 999;
      if (ia !== ib) return ia - ib;
      return a.name.localeCompare(b.name);
    });

    host.innerHTML = '';
    if (!rows.length){
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = TOOLS.length ? '没找到这样的工具' : '一个工具都没拿到';
      host.appendChild(p);
      return;
    }
    rows.forEach(function(t){ host.appendChild(buildCard(t)); });
  }

  $('q').addEventListener('input', render);

  call('tools.list').then(function(r){
    if (r && r.ok && Array.isArray(r.tools)){
      TOOLS = r.tools;
      setBadge(TOOLS.length + ' 个工具');
      render();
    } else {
      setBadge('拿不到清单', true);
      $('list').innerHTML = '';
      var p = document.createElement('p');
      p.className = 'empty';
      p.textContent = '✕ ' + ((r && r.error) || '不知道为啥拿不到');
      $('list').appendChild(p);
    }
  }).catch(function(e){
    setBadge('桥没就绪', true);
    $('list').innerHTML = '';
    var p = document.createElement('p');
    p.className = 'empty';
    p.textContent = '✕ 没能连上猫这边：' + (e && e.message ? e.message : String(e));
    $('list').appendChild(p);
  });
})();
</script>
</body>
</html>
