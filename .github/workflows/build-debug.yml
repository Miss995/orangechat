name: Build Debug APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Version marker
        run: echo "== ORANGE-SURGERY-v6 =="

      - uses: actions/checkout@v4
        with:
          # 强制从 main 分支构建（否则 Run workflow 时选到旧分支会构建旧代码）
          ref: main

      - name: Init material-color-utilities submodule
        run: |
          git submodule update --init --depth 1 material3/material-color-utilities

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install pnpm & add to PATH
        run: |
          npm install -g pnpm@9 || sudo npm install -g pnpm@9
          PNPM_DIR="$(npm config get prefix)/bin"
          echo "$PNPM_DIR" >> $GITHUB_PATH
          echo "pnpm dir: $PNPM_DIR"
          which pnpm
          pnpm --version

      - name: Gradle cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle-wrapper.properties') }}

      - name: Create google-services.json placeholder
        run: |
          mkdir -p app
          cat > app/google-services.json <<'EOF'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "placeholder",
              "storage_bucket": "placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000",
                  "android_client_info": {
                    "package_name": "me.rerere.orangechat.debug"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "placeholder"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ]
          }
          EOF

      # 固定签名：复用缓存的 debug.keystore（保证每次构建签名一致 → 可覆盖安装，不用卸载旧版）
      - name: Restore debug keystore
        id: keystore-cache
        uses: actions/cache@v4
        with:
          path: app/debug.keystore
          key: orange-debug-keystore-v1

      - name: Generate debug keystore if missing
        if: steps.keystore-cache.outputs.cache-hit != 'true'
        run: |
          keytool -genkeypair -v \
            -keystore app/debug.keystore \
            -storepass android \
            -storetype PKCS12 \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -alias androiddebugkey \
            -keypass android \
            -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          cd web-ui && pnpm install && cd ..
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: orangechat-debug
          path: app/build/outputs/apk/debug/*.apk
